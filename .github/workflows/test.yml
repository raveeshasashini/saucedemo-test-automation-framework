name: SauceDemo QA Automation Suite (Java & Selenium)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  automation-tests:
    name: Run Selenium E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Verify Environment
        run: |
          java -version
          mvn -version
          google-chrome --version

      - name: Run TestNG Test Suite (Headless)
        run: mvn clean test
        env:
          HEADLESS: "true"

      - name: Upload Surefire Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-test-reports
          path: target/surefire-reports/
          retention-days: 14

      - name: Upload Failure Screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: screenshots/
          retention-days: 14
